<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>検索結果</title>
<link rel="stylesheet" href="/cu_static_addon_site_search/css/cu-static-search.css">
</head>
<body>
<main class="cu-search-page">
<h2 class="bs-search-title">検索結果</h2>
<form class="bs-search-form" role="search" data-cu-static-search-form>
<input type="search" name="q" placeholder="キーワード" class="cu-search-input">
<button type="submit" class="cu-search-submit">検索</button>
</form>
<section class="bs-search-result" data-cu-static-search-result></section>
</main>
<script src="/cu_static_addon_site_search/js/cu-static-search.js" data-cu-static-search-base="/cu_static_addon_site_search/" defer></script>
</body>
</html>
